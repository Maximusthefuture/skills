# openspec/config.yaml — OpenSpec + java-dev-flow
# Положи в openspec/config.yaml проекта. Если файл уже есть — перенеси разделы вручную.
# Работает со встроенной схемой spec-driven. Для схемы java-flow поменяй строку schema
# (правила design и tasks тогда дублируют инструкции схемы — это не мешает).

schema: spec-driven

# Попадает в инструкции ВСЕХ артефактов. Только то, чего агент не выведет из кода.
# Поправь стек под проект.
context: |
  Стек: Java 21, Spring Boot 3.x, Hibernate (JPA), PostgreSQL, Liquibase; сборка через wrapper (./mvnw или ./gradlew).
  Тесты: JUnit 5 + AssertJ; всё, что касается БД, — на Testcontainers PostgreSQL, не на H2; Kafka — на Testcontainers,
  а если в проекте нет Testcontainers — на @EmbeddedKafka (spring-kafka-test); внешний HTTP — WireMock.
  Инженерный процесс задаёт скилл java-dev-flow: классификация S/M/L, дизайн по think-before-coding,
  реализация каждой задачи по java-tdd, проверка по размеру и сигналам. Доменные скиллы backend-design-java
  подключаются только по сигналам в задаче и коде.
  Change создаётся для задач размера M и L. Правки размера S, баги, возвращающие уже описанное в specs поведение,
  и рефакторинг без изменения поведения делаются без change.
  Применённые changeset'ы Liquibase не редактируются; rename, drop и смена типа — только через expand/contract.

rules:
  proposal:
    - "Первая строка раздела Impact — классификация java-dev-flow: «Маршрут: <тип> · <M|L> · сигналы: <признаки> → <скиллы>»."
    - "В Impact явно перечисли изменения публичного API, событий и схемы БД; ломающие помечай **BREAKING**."
    - "Для размера L предложи в What Changes разбиение на независимые PR."
  specs:
    - "Каждый Scenario — одно наблюдаемое поведение, которое станет одним тестом (одним циклом java-tdd). В WHEN/THEN — конкретные значения: HTTP-статус, код ошибки, поле ответа, состояние в БД, опубликованное событие."
    - "Ошибочные пути — отдельные сценарии: невалидный ввод → 400 с кодом, нет прав → 403, чужой ресурс → 404, конфликт или дубликат → 409, недоступность внешней системы."
    - "Для операций с побочными эффектами (запись + сообщение или внешний вызов) добавь сценарий повтора: тот же запрос или событие дважды дают один эффект."
  design:
    - "Перед написанием вызови скилл think-before-coding, если он есть, и доменные скиллы по сигналам из Impact в proposal.md."
    - "Для change размера M и L design.md создавай всегда."
    - "Context — тип компонента и ожидаемая нагрузка. Decisions — данные и инварианты (какие constraint'ы, какой changeset), граница транзакции, авторизация (кто, какое право, область строк), идемпотентность и конкуренция (ключ, @Version или блокировка, outbox), наблюдаемость (логи, метрики, health). Risks — режимы отказа и как их обнаружить и восстановиться."
    - "В Decisions зафиксируй порядок сборки: changeset → entity и репозиторий → сервис с границей транзакции → controller или listener → маппинг ошибок → метрики."
    - "Migration Plan — changeset'ы по правилам migration-safety (CONCURRENTLY, NOT VALID, expand/contract) и откат."
    - "Если change добавляет вариант к набору, по которому код уже ветвится (способ оплаты, провайдер, канал, тип документа, статус), вызови скилл java-extensibility-review по затрагиваемым классам и запиши его вердикт в Decisions: расширяем как есть или сначала подготовительный рефакторинг."
  tasks:
    - "Группы — срезы в порядке сборки из design.md. Внутри группы — по задаче на поведение, обычно на один Scenario из specs."
    - "Формат задачи: «X.Y <Scenario или поведение> — <уровень теста: unit | @DataJpaTest + Testcontainers | @WebMvcTest | @SpringBootTest + Testcontainers | @SpringBootTest + @EmbeddedKafka | WireMock> — проверка: <тест или команда>». Тест пишется первым и должен упасть до реализации."
    - "Не выноси тесты в отдельную группу в конце: каждая группа несёт свои тесты."
    - "Если в design.md решено сначала рефакторить, первая группа — «Подготовительный рефакторинг»: поведение не меняется, тесты зелёные до и после; новый вариант добавляется в следующих группах."
    - "Последняя группа «Проверка» — только интеграционные проверки: полный прогон (./mvnw verify или ./gradlew check); агент java-code-reviewer по diff (если агента нет — скилл java-code-review); java-extensibility-review по изменённым классам, если в diff выросло ветвление по типу или статусу; review-migration, если есть changeset'ы; test-audit по новым тестам; для L — агенты security-reviewer, schema-reviewer, incident-thinker по сигналам."

operations:
  apply:
    guidance:
      - "Перед первой задачей вызови скилл java-dev-flow и работай в его режиме OpenSpec (references/openspec.md): артефакты change — это его дизайн и план, фазы 0–3 уже пройдены."
      - "Каждую задачу реализуй через скилл java-tdd: сначала тест, запуск и падение на assertion по ожидаемой причине, потом минимальный код, потом рефакторинг."
      - "Подключай доменные скиллы backend-design-java по сигналам текущей задачи, а не все сразу."
      - "Предупреждения хуков backend-design-java после записи файлов исправляй в той же задаче или фиксируй с обоснованием для итогового отчёта."
      - "Отмечай задачу [x] только после того, как видел её тест красным, а затем зелёным вместе с тестами модуля."
      - "Если реализация расходится с design.md или specs — остановись и предложи /opsx:update, не отклоняйся молча."
      - "Задачи группы «Проверка» выполняй реальным запуском команд; «тесты зелёные» — только по выводу команды, запущенной после последней правки."
      - "Ревью в группе «Проверка» поручай агенту java-code-reviewer (свежий контекст, без правок): передай область diff и путь к этому change как описание намерения. Его находки проверь по коду сам; баги исправляй через тест."
  archive:
    guidance:
      - "Архивируй, только если отмечены все задачи, включая группу «Проверка», и полный прогон тестов выполнен в этой сессии после последней правки; иначе назови, чего не хватает."
      - "В итоговом сообщении дай отчёт по шаблону java-dev-flow (references/templates.md): сделано по сценариям, проверки и их результат, что не запускалось, решения, follow-ups."
      - "Задачи в Jira по follow-ups — только через скилл jira-tasks и только по просьбе пользователя."
