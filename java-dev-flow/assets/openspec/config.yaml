# openspec/config.yaml — OpenSpec + java-dev-flow
# Put it into the project's openspec/config.yaml. If the file already exists, move the sections by hand.
# Works with the built-in spec-driven schema. For the java-flow schema change the schema line
# (the design and tasks rules then duplicate the schema's instructions — that does no harm).

schema: spec-driven

# Goes into the instructions of ALL artifacts. Only what the agent cannot infer from the code.
# Adjust the stack to the project.
context: |
  Stack: Java 21, Spring Boot 3.x, Hibernate (JPA), PostgreSQL, Liquibase; build via the wrapper (./mvnw or ./gradlew).
  Tests: JUnit 5 + AssertJ; everything that touches the DB runs on Testcontainers PostgreSQL, not H2; Kafka runs on Testcontainers,
  or on @EmbeddedKafka (spring-kafka-test) if the project has no Testcontainers; external HTTP — WireMock.
  The engineering process is set by the java-dev-flow skill: S/M/L classification, design per think-before-coding,
  every task implemented per java-tdd, verification by size and signals. backend-design-java domain skills
  are loaded only by signals in the task and the code.
  A change is created for M and L tasks. S edits, bugs that restore behavior already described in specs,
  and refactoring without behavior change are done without a change.
  Applied Liquibase changesets are never edited; rename, drop and type changes only via expand/contract.
  Write the artifacts in the language the team uses for this project.

rules:
  proposal:
    - "The first line of the Impact section is the java-dev-flow classification: \"Route: <type> · <M|L> · signals: <evidence> → <skills>\"."
    - "In Impact list changes to the public API, events and DB schema explicitly; mark breaking ones **BREAKING**."
    - "For size L propose a split into independent PRs in What Changes."
  specs:
    - "Every Scenario is one observable behavior that becomes one test (one java-tdd cycle). WHEN/THEN carry concrete values: HTTP status, error code, response field, DB state, published event."
    - "Error paths are separate scenarios: invalid input → 400 with a code, no permission → 403, someone else's resource → 404, conflict or duplicate → 409, an external system being unavailable."
    - "For operations with side effects (a write + a message or an external call) add a retry scenario: the same request or event twice produces one effect."
  design:
    - "Before writing, call the think-before-coding skill if it exists, and the domain skills by the signals from Impact in proposal.md."
    - "For M and L changes always create design.md."
    - "Context — component type and expected load. Decisions — data and invariants (which constraints, which changeset), the transaction boundary, authorization (who, which permission, which rows), idempotency and concurrency (key, @Version or lock, outbox), observability (logs, metrics, health). Risks — failure modes and how to detect and recover from them."
    - "In Decisions pin the build order: changeset → entity and repository → service with a transaction boundary → controller or listener → error mapping → metrics."
    - "Migration Plan — changesets per migration-safety (CONCURRENTLY, NOT VALID, expand/contract) and rollback."
    - "If the change adds a variant to a set the code already branches on (payment method, provider, channel, document type, status), call the java-extensibility-review skill on the affected classes and record its verdict in Decisions: extend as is, or a preparatory refactoring first."
  tasks:
    - "Groups are slices in the build order from design.md. Inside a group — one task per behavior, usually per Scenario from specs."
    - "Task format: \"X.Y <Scenario or behavior> — <test level: unit | @DataJpaTest + Testcontainers | @WebMvcTest | @SpringBootTest + Testcontainers | @SpringBootTest + @EmbeddedKafka | WireMock> — verify: <test or command>\". The test is written first and must fail before the implementation."
    - "Do not move tests into a separate group at the end: every group carries its own tests."
    - "If design.md decided to refactor first, the first group is \"Preparatory refactoring\": behavior does not change, tests green before and after; the new variant is added in the following groups."
    - "The last group \"Verification\" holds only integration checks: the full run (./mvnw verify or ./gradlew check); the java-code-reviewer and critic agents on the diff — in one message, in parallel (no agents — the java-code-review skill and the critic questions from the java-dev-flow checklist); java-extensibility-review on the changed classes if branching on type or status grew in the diff; review-migration if there are changesets; test-audit on new tests; for L — the security-reviewer, schema-reviewer, incident-thinker agents by signals."

operations:
  apply:
    guidance:
      - "Before the first task call the java-dev-flow skill and work in its OpenSpec mode (references/openspec.md): the change artifacts are its design and plan, phases 0–3 are done."
      - "Implement every task via the java-tdd skill: test first, run it and see it fail on an assertion for the expected reason, then minimal code, then refactoring."
      - "Load backend-design-java domain skills by the signals of the current task, not all at once."
      - "Fix backend-design-java hook warnings after file writes in the same task or record them with a justification for the final report."
      - "Tick a task [x] only after you saw its test red and then green together with the module tests."
      - "If the implementation diverges from design.md or specs — stop and suggest /opsx:update, do not deviate silently."
      - "Run the \"Verification\" group tasks by actually running the commands; \"tests are green\" only from the output of a command run after the last edit."
      - "Hand the review in the \"Verification\" group to the java-code-reviewer and critic agents in one message, in parallel (fresh context, no edits): pass the diff scope and the path to this change as the description of intent, and the critic also the size and what is known about production. Check their findings against the code yourself; fix bugs and confirmed blockers test-first, bring the critic's questions to the user."
  archive:
    guidance:
      - "Archive only if all tasks are ticked, including the \"Verification\" group, and the full test run happened in this session after the last edit; otherwise name what is missing."
      - "In the final message give the report per the java-dev-flow template (references/templates.md): done by scenario, checks and their results, what did not run, decisions, follow-ups."
      - "Jira tickets for follow-ups — only via the jira-tasks skill and only at the user's request."
