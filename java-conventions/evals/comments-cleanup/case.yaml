schema_version: "1.1"
name: comments-cleanup
context:
  scaffold_script: place-files.sh
expected_outcome: |
  Из RefundService убраны комментарии-пересказы кода, разделители «Поля/Методы», @author/@since,
  Javadoc метода с @param-пересказами и закомментированный save. Комментарий про 180 дней эквайера
  сохранён как причина, сокращён до 5 слов (или заменён именованной константой с коротким комментарием).
  Javadoc класса удалён либо сокращён до 20 слов без пересказа имени. TODO без тикета удалён или
  оставлен с вопросом пользователю про тикет. Логика метода не изменилась. Всё по-русски.
