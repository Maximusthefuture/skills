openapi: 3.0.3
info:
  title: Shop API
  version: 1.0.0
paths:
  /orders:
    post:
      tags: [orders]
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Problem'
  /orders/{orderId}:
    get:
      tags: [orders]
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/Problem'
components:
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    OrderStatus:
      type: string
      enum: [NEW, PAID, SHIPPED, CANCELLED]
    Order:
      type: object
      required: [id, customerId, amount, status]
      properties:
        id:
          type: integer
          format: int64
        customerId:
          type: integer
          format: int64
        amount:
          type: number
        status:
          $ref: '#/components/schemas/OrderStatus'
    CreateOrderRequest:
      type: object
      required: [customerId, amount]
      properties:
        customerId:
          type: integer
          format: int64
        amount:
          type: number
          minimum: 0.01
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
